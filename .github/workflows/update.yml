name: update data
on:
  schedule:
    - cron: "0 3 * * *" # 06:00 Moscow
  workflow_dispatch:
    inputs:
      test_issue:
        description: "Open a test issue"
        type: boolean
        default: false
permissions:
  contents: write
  issues: write
concurrency:
  group: update-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Collect rates, key rate and news
        env:
          # Mintsifry root/sub CA (gosuslugi.ru/crt) — trusted only by this process, for bank sites
          NODE_EXTRA_CA_CERTS: certs/russian-trusted-ca.pem
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/update.mjs ${{ inputs.test_issue && '--test-issue' || '' }}
      - name: Commit data if changed
        run: |
          if git diff --quiet -- data; then echo "no changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "data: daily update $(date -u +%F)"
          git push
